[package]
name = "shoes"
version = "0.2.7"
edition = "2024"
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "proxy-server", "shadowsocks", "v2ray", "vmess"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[features]
default = []
ffi = []  # Enable FFI module for non-Android builds

[dependencies]
async-trait = "0.1"
# v2ray-router for geo routing - using git with fixed commit
v2ray-router = { git = "https://github.com/fagao-ai/v2ray-router", rev = "f38d37d1" }
# Force thiserror 1.x for compatibility with kitty project
thiserror = "1.0"
aws-lc-rs = { version = "1", default-features = false }
base64 = "0.22"
blake3 = "1"
bytes = "1"
h2 = "0.4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
dashmap = "6"
digest = "0.10"
env_logger = "0.11"
futures = "0.3"
h3 = "0.0"
h3-quinn = "0.0"
# Git version required for H3 disable_grease option (needed for Cloudflare).
# See: https://github.com/hickory-dns/hickory-dns/pull/2085
hickory-resolver = { git = "https://github.com/hickory-dns/hickory-dns", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "1"
indexmap = "2"
log = { version = "0.4", features = ["release_max_level_debug"] }
lru = "0.12"
md-5 = "0.10"
memchr = "2"
mime_guess = "2"
notify = "8"
parking_lot = "0.12"
percent-encoding = "2"
prost = "0.12"
# CIDR utilities for geo IP matching
cidr = "0.2"
cidr-utils = "0.6"
# Domain parsing
addr = "0.15"
# URL parsing for geo routing
url = "2.5"
# Regex for geosite matching
regex = "1"
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.9"
rand_core = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustc-hash = "2"
rust-argon2 = "1"
rustls = "0.23"
serde = { version = "1", features = ["derive", "std"] }
subtle = "2"
serde_yaml = "0.9"
sha3 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["time"] }
webpki-roots = { version = "1" }

# TUN device support (for VPN mode)
tun = { version = "0.8", features = ["async"] }
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32"] }
etherparse = "0.16"

x509-parser = { version = "0.15", default-features = false, features = ["verify"] }
libc = "0.2.179"

[dev-dependencies]
tempfile = "3"
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = "0.26"
serde_json = "1"

# jemalloc for better memory performance (not supported on Windows MSVC or iOS)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios")))'.dependencies]
tikv-jemallocator = "*"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "*"
chrono = "*"
jni = "*"
ndk-sys = "*"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
